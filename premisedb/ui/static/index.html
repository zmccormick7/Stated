<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PremiseDB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav id="sidebar" aria-label="Threads">
  <div class="rail">
    <button id="toggle" aria-label="Show or hide threads" title="Threads">≡</button>
    <button id="new" title="New question">+</button>
  </div>
  <ul id="threads"></ul>
</nav>
<main id="main">
  <div id="thread"></div>
  <form id="ask">
    <label for="question" class="hidden">Question</label>
    <input id="question" type="text" autocomplete="off" placeholder="Ask a question">
    <button type="submit">Ask</button>
  </form>
</main>
<script src="/static/app.js"></script>
</body>
</html>

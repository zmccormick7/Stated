<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PremiseDB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav id="sidebar" aria-label="Threads">
  <div class="rail">
    <button id="toggle" aria-label="Show or hide threads" title="Threads">≡</button>
    <button id="new" title="New question">+</button>
  </div>
  <ul id="threads"></ul>
  <div id="status"></div>
</nav>
<main id="main">
  <div id="thread"></div>
  <form id="ask">
    <div class="box">
      <label for="question" class="hidden">Question</label>
      <textarea id="question" rows="2" placeholder="Ask a question"></textarea>
      <div class="controls">
        <label for="effort" class="hidden">Effort</label>
        <select id="effort">
          <option value="1">1 min</option>
          <option value="5" selected>5 min</option>
          <option value="20">20 min</option>
        </select>
        <button type="submit">Ask</button>
      </div>
    </div>
    <div id="hint"></div>
  </form>
  <div id="problem"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>

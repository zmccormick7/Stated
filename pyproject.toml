[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premisedb"
version = "0.0.1"
description = "A research database for agents"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["premisedb*"]

[tool.setuptools.package-data]
premisedb = ["schema.sql", "calibrations.json"]

[project.optional-dependencies]
evaluation = ["scikit-learn>=1.6,<2", "tiktoken>=0.12,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premisedb"
version = "0.0.1"
description = "A research database for agents"
requires-python = ">=3.12"

[project.scripts]
premisedb = "premisedb.cli:main"

[tool.setuptools.packages.find]
include = ["premisedb*"]

[tool.setuptools.package-data]
premisedb = ["schema.sql"]

[project.optional-dependencies]
cli = ["tiktoken>=0.12,<1"]
evaluation = ["scipy>=1.14,<2", "tiktoken>=0.12,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stated"
version = "0.0.1"
description = "A research database for agents"
requires-python = ">=3.12"

[project.scripts]
stated = "stated.cli:main"

[tool.setuptools.packages.find]
include = ["stated*"]

[tool.setuptools.package-data]
stated = ["schema.sql", "ui/schema.sql", "ui/static/*", "skills/*/SKILL.md"]

[project.optional-dependencies]
cli = ["tiktoken>=0.12,<1", "pypdf>=5,<7"]
evaluation = ["scipy>=1.14,<2", "tiktoken>=0.12,<1"]
